# Loopback placeholder for local development.
ip = 127.0.0.1
port = 13400

# Optional discover destination. The library default is limited broadcast
# 255.255.255.255; unicast (for example 127.0.0.1) is also supported.
# broadcast = 255.255.255.255

# Example tester address from the ISO 13400 external test equipment range
# (0x0E00–0x0FFF). Replace with your own tester address; this is not a field value.
# If omitted, doiplite-cli activate uses 0x0E00 as that documented example default.
# tester_address = 0x0E00

# ISO default routing activation type (0x00). Override if your entity requires another type.
# activation_type = 0x00

# Optional I/O timeout in milliseconds (library default is 2000 for routing activation).
# timeout_ms = 2000

# Provide your entity logical address when you need it; not used by M1 activate.
# entity_address =

# ReadDataByIdentifier DID for doiplite-cli read-version.
# There is no library default; provide your own via this key or --did.
# Example placeholder only (not a plant / OEM DID):
# version_did = 0x0001

# DiagnosticSessionControl sub-function for doiplite-cli session.
# There is no library default (including no programming session).
# Provide your own via this key or --session.
# Example placeholder only (ISO defaultSession 0x01, not a plant / OEM value):
# session_type = 0x01

# TesterPresent sub-function for doiplite-cli tester-present.
# There is no library default (including no zeroSubFunction).
# Provide your own via this key or --sub-function.
# Example placeholder only (ISO zeroSubFunction 0x00, not a plant / OEM value):
# tester_present_sub_function = 0x00

